version: '3.7'

services:
  app_proxy:
    environment:
      APP_HOST: crystal_frontend_1
      APP_PORT: 80

  frontend:
    image: ghcr.io/samerberjawi/crystal:frontend-latest@sha256:e20f80e38f70e3ac8777496479f3be0366eb8cb5defddbb93b6ca4abba5d958e
    restart: on-failure
    depends_on:
      backend:
        condition: service_healthy
    networks:
      default:
        aliases:
          - frontend

  backend:
    image: ghcr.io/samerberjawi/crystal:backend-latest@sha256:684d1bb95f0ce7742f651ae8d1d97ca9d735df5c5fe6b161b14dc3cca9f19eb2
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      NODE_ENV: production
      AUTH_COOKIE_SECURE: "false"
      JWT_SECRET: ${APP_CRYSTAL_JWT_SECRET}
      DATABASE_HOST: crystal_db_1
      DATABASE_PORT: 5432
      DATABASE_USER: crystal
      DATABASE_PASSWORD: ${APP_CRYSTAL_DB_PASSWORD}
      DATABASE_NAME: crystal
    networks:
      default:
        aliases:
          - backend

  db:
    image: postgres:15-alpine@sha256:fe0737ba566a2c5b2a28f34433c0a423261900ec17b9bf7ad115e1aae7e57f1b
    restart: on-failure
    environment:
      POSTGRES_DB: crystal
      POSTGRES_USER: crystal
      POSTGRES_PASSWORD: ${APP_CRYSTAL_DB_PASSWORD}
    volumes:
      - ${APP_DATA_DIR}/data/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crystal -d crystal"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      default:
        aliases:
          - db
